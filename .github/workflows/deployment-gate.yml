name: LifeOS Deployment Gate

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate PWA deployment
        run: python deployment/validate_deployment.py .
